<div class="login-container">

  <mat-card class="login-card">

    <h1>Login</h1>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >

      <mat-form-field appearance="outline">

        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
        >

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        >

      </mat-form-field>

      <button
        mat-raised-button
        type="submit"
      >
        Login
      </button>

    </form>

    <p class="signup-text">

      Don't have an account?

      <a routerLink="/signup">
        Signup
      </a>

    </p>

  </mat-card>

</div>
